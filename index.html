<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a56db">
  <title>บันทึกพัสดุชำรุด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>📦 บันทึกพัสดุชำรุด</h1>
    <span id="dateDisplay" class="date-badge"></span>
  </header>

  <main class="container">
    <form id="mainForm" class="card" novalidate>

      <div class="field">
        <label for="date">ว/ด/ป</label>
        <input type="text" id="date" readonly>
      </div>

      <div class="field">
        <label for="itemSearch">เลือกรายการ <span class="req">*</span></label>
        <input type="search" id="itemSearch" placeholder="🔍 พิมพ์ค้นหารหัส / ชื่อพัสดุ">
        <select id="item" required>
          <option value="">-- เลือกรายการ --</option>
        </select>
        <div id="itemInfo" class="item-info hidden"></div>
      </div>

      <div class="row">
        <div class="field">
          <label for="network">โครงข่าย <span class="req">*</span></label>
          <input type="text" id="network" placeholder="ระบุโครงข่าย" required>
        </div>
        <div class="field">
          <label for="wbs">WBS <span class="req">*</span></label>
          <input type="text" id="wbs" placeholder="ระบุ WBS" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="qty">จำนวน <span class="req">*</span></label>
          <div class="input-unit">
            <input type="number" id="qty" min="0" step="any" inputmode="decimal" placeholder="0" required>
            <span id="unitLabel">หน่วย</span>
          </div>
        </div>
        <div class="field">
          <label for="supervisor">ผู้ควบคุม <span class="req">*</span></label>
          <input type="text" id="supervisor" placeholder="ชื่อผู้ควบคุม" required>
        </div>
      </div>

      <div id="totalBox" class="total hidden">มูลค่าประเมิน: <b id="totalVal">0</b> บาท</div>

      <div class="field">
        <label>รูปถ่ายพัสดุ <span class="req">*</span> <small>(ได้หลายรูป)</small></label>
        <label class="upload" for="itemPhotos">📷 ถ่าย / เลือกรูปพัสดุ</label>
        <input type="file" id="itemPhotos" accept="image/*" multiple hidden>
        <div id="itemPreview" class="preview"></div>
      </div>

      <div class="field">
        <label>รูปถ่ายสลิป <span class="req">*</span> <small>(ได้หลายรูป)</small></label>
        <label class="upload" for="slipPhotos">🧾 ถ่าย / เลือกรูปสลิป</label>
        <input type="file" id="slipPhotos" accept="image/*" multiple hidden>
        <div id="slipPreview" class="preview"></div>
      </div>

      <p class="note">* ระบบจะบีบขนาดรูปให้ไม่เกิน 1 MB อัตโนมัติ</p>

      <button type="submit" id="submitBtn" class="btn">ส่งข้อมูล</button>
    </form>
  </main>

  <div id="overlay" class="overlay hidden">
    <div class="progress-card">
      <div class="loader"></div>
      <p id="overlayText">กำลังบันทึก...</p>
      <div id="progressWrap" class="progress hidden">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <p id="progressPct" class="progress-pct hidden">0%</p>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
