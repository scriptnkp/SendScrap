<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b2a86">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="พัสดุชำรุด">
  <title>บันทึกพัสดุชำรุด</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235b2a86'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E📦%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="offline" class="offline" hidden>⚠️ ไม่มีสัญญาณอินเทอร์เน็ต</div>

  <header class="app-header">
    <div class="header-inner">
      <div class="logo" aria-hidden="true">📦</div>
      <div>
        <h1>บันทึกพัสดุชำรุด</h1>
        <p class="sub">กฟจ.นครพนม</p>
      </div>
    </div>
    <div class="date-chip" id="now">กำลังโหลด...</div>
  </header>

  <main class="container">
    <form id="form" novalidate autocomplete="off">

      <!-- 1. ข้อมูลพัสดุ -->
      <section class="card">
        <h2 class="card-title"><span class="step">1</span> ข้อมูลพัสดุ</h2>

        <div class="field" id="f-item">
          <label id="lblItem">รายการพัสดุ <span class="req">*</span></label>
          <input type="hidden" id="item">
          <button type="button" id="itemBtn" class="picker-btn" aria-haspopup="dialog" aria-labelledby="lblItem itemBtn">
            <span id="itemText" class="placeholder">แตะเพื่อเลือกรายการ</span>
            <span class="chev" aria-hidden="true">▾</span>
          </button>
          <p id="itemInfo" class="chip-info" hidden></p>
          <p class="msg"></p>
        </div>

        <div class="grid2">
          <div class="field" id="f-network">
            <label for="network">โครงข่าย <span class="req">*</span></label>
            <input id="network" type="text" inputmode="numeric" enterkeyhint="next" placeholder="เช่น 12345678">
            <p class="msg"></p>
          </div>
          <div class="field" id="f-wbs">
            <label for="wbs">WBS <span class="req">*</span></label>
            <input id="wbs" type="text" autocapitalize="characters" enterkeyhint="next" placeholder="เช่น N-6612-xxxx">
            <p class="msg"></p>
          </div>
        </div>

        <div class="grid2">
          <div class="field" id="f-qty">
            <label for="qty">จำนวน <span class="req">*</span> <span id="unit" class="unit"></span></label>
            <div class="stepper">
              <button type="button" id="qMinus" aria-label="ลดจำนวน">−</button>
              <input id="qty" type="number" inputmode="decimal" min="0" step="any" enterkeyhint="next" placeholder="0">
              <button type="button" id="qPlus" aria-label="เพิ่มจำนวน">+</button>
            </div>
            <p class="msg"></p>
          </div>
          <div class="field" id="f-supervisor">
            <label for="supervisor">ผู้ควบคุม <span class="req">*</span></label>
            <input id="supervisor" type="text" autocomplete="name" enterkeyhint="done" placeholder="ชื่อ-สกุล">
            <p class="msg"></p>
          </div>
        </div>
      </section>

      <!-- 2. รูปพัสดุ -->
      <section class="card" id="f-photoItem">
        <h2 class="card-title"><span class="step">2</span> รูปถ่ายพัสดุ <span class="req">*</span><span class="count" id="countItem">0 รูป</span></h2>
        <div class="thumbs" id="thumbsItem"></div>
        <div class="btn-pair">
          <label class="btn-photo cam" for="camItem">📷 ถ่ายรูป</label>
          <label class="btn-photo" for="fileItem">🖼️ เลือกรูป</label>
        </div>
        <input id="camItem" type="file" accept="image/*" capture="environment" hidden>
        <input id="fileItem" type="file" accept="image/*" multiple hidden>
        <p class="msg"></p>
      </section>

      <!-- 3. รูปสลิป -->
      <section class="card" id="f-photoSlip">
        <h2 class="card-title"><span class="step">3</span> รูปถ่ายสลิป <span class="req">*</span><span class="count" id="countSlip">0 รูป</span></h2>
        <div class="thumbs" id="thumbsSlip"></div>
        <div class="btn-pair">
          <label class="btn-photo cam" for="camSlip">📷 ถ่ายรูป</label>
          <label class="btn-photo" for="fileSlip">🖼️ เลือกรูป</label>
        </div>
        <input id="camSlip" type="file" accept="image/*" capture="environment" hidden>
        <input id="fileSlip" type="file" accept="image/*" multiple hidden>
        <p class="msg"></p>
      </section>

      <p class="hint center">รูปทุกใบถูกบีบอัดให้ไม่เกิน 1 MB อัตโนมัติ</p>

      <div class="submit-bar">
        <div class="submit-inner">
          <div class="summary" id="summary">พัสดุ 0 • สลิป 0</div>
          <button id="submit" class="btn-submit" type="submit">ส่งข้อมูล</button>
        </div>
      </div>
    </form>
  </main>

  <!-- ตัวเลือกรายการ (bottom sheet) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="เลือกรายการพัสดุ">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <input id="search" type="search" placeholder="🔍 ค้นหาชื่อหรือรหัสพัสดุ" enterkeyhint="search">
        <button type="button" id="sheetClose" class="sheet-close" aria-label="ปิด">✕</button>
      </div>
      <div id="itemList" class="item-list"></div>
    </div>
  </div>

  <!-- ดูรูปขยาย -->
  <div id="lightbox" class="lightbox" hidden>
    <img id="lightImg" alt="">
    <button type="button" id="lightClose" class="sheet-close light-x" aria-label="ปิด">✕</button>
  </div>

  <!-- สถานะการส่ง -->
  <div id="overlay" class="overlay" hidden>
    <div class="dialog" role="status" aria-live="polite">
      <div id="spinner" class="spinner"></div>
      <div id="doneIcon" class="done-icon" hidden>
        <svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <p id="overlayText">กำลังส่งข้อมูล...</p>
      <p id="overlaySub" class="hint">กรุณาอย่าปิดหน้านี้</p>
      <div class="bar" id="barWrap"><div id="bar"></div></div>
      <button id="again" class="btn-submit" type="button" hidden>บันทึกรายการใหม่</button>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/items.js"></script>
  <script src="js/image.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
